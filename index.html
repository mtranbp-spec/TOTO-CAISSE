async function envoyerDevis(devis, showToast, type) {

        + fmt((devis.lignes || []).reduce((s, l) => s + l.price * l.qty, 0)) + " TTC.\n\nCordialement,\nTOTO - 45 98 23";

    // piece jointe. Sinon on telecharge et on ouvre le client mail.

        try {
            await navigator.share({ files: [fichier], title: sujet, text: corps });
            return;
        }
        catch (e) {
            if (e && e.name === "AbortError")
                return; // partage annule par l'utilisateur
        }

    const a = document.createElement("a");

    const dest = (devis.client && devis.client.email) ? encodeURIComponent(devis.client.email) : "";
