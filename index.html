function ReorderGrid({ items, active, gridStyle, renderItem, onReorder }) {

            e.currentTarget.setPointerCapture(e.pointerId);

        setDragId(id);
        setIds(liste.map((i) => i.id));
        setOffset({ x: 0, y: 0 });

                const suivant = courant.slice();

                // tuile ferait un bond au moment où les voisines se décalent.
