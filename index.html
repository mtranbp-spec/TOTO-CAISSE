<style>

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --toto-tabbar: 60px; }
  html, body { margin: 0; padding: 0; background: #161311; overscroll-behavior: none; }
  body { font-family: 'Inter', sans-serif; color: #F3EAD9; }
  .font-display { font-family: 'Fredoka', sans-serif; }
  .tabnum { font-variant-numeric: tabular-nums; }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input { font-family: inherit; }
  /* Mode réorganisation : léger tremblement, comme sur l'écran d'accueil iOS. */
  @keyframes toto-wiggle {
    0%   { transform: rotate(-0.7deg); }
    50%  { transform: rotate(0.7deg); }
    100% { transform: rotate(-0.7deg); }
  }
  .toto-wiggle { animation: toto-wiggle 0.22s ease-in-out infinite; }
  .toto-drag { touch-action: none; }
  @media (prefers-reduced-motion: reduce) { .toto-wiggle { animation: none; } }

  /* Sur téléphone, la navigation passe en barre basse : c'est là que le pouce
     tombe naturellement. Les !important sont nécessaires pour l'emporter sur
     les styles en ligne des composants. */
  /* Barre de catégories : pas d'ascenseur visible, et la souris peut la
     tirer comme un doigt sur un téléphone. */
  .toto-barre-glisse { scrollbar-width: none; -ms-overflow-style: none; cursor: grab; user-select: none; }
  .toto-barre-glisse::-webkit-scrollbar { display: none; height: 0; }

  /* Le nom occupe toujours deux lignes, remplies ou non : sans cela les
     tuiles d'une même rangée avaient des hauteurs différentes. Au-delà, le
     texte est coupé par des points de suspension. */
  .toto-nom2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.2;
    min-height: 2.4em;
  }
  .toto-carte { display: flex; flex-direction: column; height: 100%; }
  .toto-carte-prix { margin-top: auto; }

  /* L'appareil photo n'a de sens que sur mobile : sur ordinateur on tape le
     code ou on le scanne à la douchette. */
  .toto-cam-mobile { display: none; }
  @media (max-width: 640px) { .toto-cam-mobile { display: flex; } }
  /* Repère du geste « tirer pour rafraîchir ». Masqué hors téléphone. */
  .toto-ptr { display: none; }
  @keyframes toto-spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    /* L'encoche et la barre d'état de l'iPhone recouvrent le haut de la page :
       viewport-fit=cover fait démarrer le contenu sous elles. On rend la
       hauteur réservée par le système. */
    .toto-header { padding-top: calc(12px + env(safe-area-inset-top)) !important; padding-bottom: 12px !important; }
    .toto-ptr {
      display: flex; align-items: center; justify-content: center;
      position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%;
      width: 38px; height: 38px; border-radius: 999px;
      background: #221D1A; border: 1px solid #3A322C;
      z-index: 45; pointer-events: none;
      transform: translate(-50%, 0);
    }
    .toto-ptr svg { transition: transform 60ms linear; }
    .toto-ptr-actif svg { animation: toto-spin 0.7s linear infinite; }
    /* Empilement par le bas : onglets, puis ticket au-dessus. Le contenu
       réserve la hauteur des deux pour ne jamais passer dessous. */
    #root { padding-bottom: calc(var(--toto-tabbar) + env(safe-area-inset-bottom)); }
    /* Seule la vue Caisse réserve la hauteur du ticket : Stats et Produits
       n'en affichent pas et n'auraient qu'un vide en bas. */
    .toto-pos-col { padding-bottom: calc(42vh + 16px) !important; }
    .toto-ticket {
      position: fixed !important;
      left: 0; right: 0;
      bottom: calc(var(--toto-tabbar) + env(safe-area-inset-bottom));
      /* clamp garantit une hauteur utilisable même sur un écran très court,
         sans devenir envahissant sur un grand téléphone. */
      height: clamp(240px, 42vh, 400px);
      width: auto !important;
      padding: 8px !important;
      z-index: 35;
    }
    .toto-ticket-card { height: 100%; }
    /* En-tête et pied gardent leur taille ; seule la liste absorbe le reste.
       min-height:0 est indispensable : sans lui un enfant flex refuse de
       rétrécir sous sa hauteur de contenu et le défilement ne s'active pas. */
    .toto-ticket-head, .toto-ticket-foot { flex-shrink: 0; }
    .toto-ticket-items { flex: 1; min-height: 0; max-height: none !important; }
    /* Le pied doit rester compact : à pleine taille il ne laissait que
       quelques pixels aux articles. */
    .toto-ticket-foot { padding: 8px 12px 10px !important; }
    .toto-ticket-foot .toto-tgc { margin-bottom: 6px !important; padding-bottom: 6px !important; }
    .toto-ticket-foot .toto-tgc > div { margin-bottom: 2px !important; font-size: 11px !important; }
    /* Sur téléphone on ne garde que « Dont TGC » : le détail par taux et le
       total HT mangeaient trois lignes que la liste d'articles réclame. */
    .toto-ticket-foot .toto-tgc > div:not(:last-child) { display: none; }
    .toto-ticket-foot .toto-total { margin-bottom: 6px !important; }
    .toto-ticket-foot .toto-total > span:last-child { font-size: 19px !important; }
    .toto-ticket-foot .toto-encaisser { padding: 11px 0 !important; margin-bottom: 4px !important; }
    .toto-ticket-foot .toto-vider { padding: 4px 0 !important; font-size: 11px !important; }
    .toto-tabs {
      position: fixed !important;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      border-radius: 0 !important;
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) !important;
      border-top: 1px solid #3A322C;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.45);

    .toto-tabs > button {
      flex: 1;
      justify-content: center;
      padding-top: 10px !important;
      padding-bottom: 10px !important;
      font-size: 13px !important;
    }
    /* Le message de confirmation doit rester au-dessus de la barre. */
    .toto-toast { bottom: calc(42vh + var(--toto-tabbar) + env(safe-area-inset-bottom) + 16px) !important; }
  }
</style>

let logoCache = null;
async function chargerLogo() {

    const r = await fetch("logo-devis.jpg");
    const b = await r.blob();

        const fr = new FileReader();

        setDragId(id);

            el.style.zIndex = "30";

        // arrivent bien plus vite que le rafraîchissement de l'affichage.
